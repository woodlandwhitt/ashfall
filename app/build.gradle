plugins { id 'com.android.application' }
android {
    namespace 'com.ashfall.meridian'
    compileSdk 34
    defaultConfig {
        applicationId 'com.ashfall.meridian'
        minSdk 24
        targetSdk 34
        // every GitHub build gets a higher number, so the phone always treats it as an update
        def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()
        versionCode 100 + run
        versionName "3.1." + run
    }
    // A fixed signing key kept in the repo, so every build is signed the same way
    // and a new APK installs over the old one without uninstalling first.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
}
