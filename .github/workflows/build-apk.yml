name: Build APK
on:
  push:
    branches: [main]
    paths-ignore: ['godot/**', '.github/workflows/godot-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: "8.9" }
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk AshfallMeridian.apk
      # 1) the APK as a run artifact (zipped by GitHub)
      - uses: actions/upload-artifact@v6
        with:
          name: AshfallMeridian-apk
          path: AshfallMeridian.apk
      # 2) the APK as a plain file on the repo's Releases page, so a phone can download it directly
      - name: Publish to Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" AshfallMeridian.apk --title "Ashfall Meridian (build ${{ github.run_number }})" --notes "Tap AshfallMeridian.apk below to download and install." --target "${{ github.sha }}"
