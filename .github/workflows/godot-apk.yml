name: Build Godot APK
on:
  push:
    branches: [main]
    paths: ['godot/**', '.github/workflows/godot-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT: 4.5.1-stable
      # build numbers run behind the workflow's run counter by the runs that failed before publishing anything
      # (three, on a bad workflow file, before build 20)
      BUILD_SKIP: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Install Godot and its export templates
        run: |
          mkdir -p $HOME/bin
          wget -q https://github.com/godotengine/godot/releases/download/$GODOT/Godot_v${GODOT}_linux.x86_64.zip
          unzip -q Godot_v${GODOT}_linux.x86_64.zip && mv Godot_v${GODOT}_linux.x86_64 $HOME/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/$GODOT/Godot_v${GODOT}_export_templates.tpz
          T=$HOME/.local/share/godot/export_templates/${GODOT/-/.}
          mkdir -p $T && unzip -q Godot_v${GODOT}_export_templates.tpz -d tpl && mv tpl/templates/* $T/
          mkdir -p $HOME/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > $HOME/.config/godot/editor_settings-4.5.tres
      # which build this is, and which installed APKs get an in-game update (build 24: rolling). Every build is now a
      # base of its own: its APK says so, and its full pack (base-N.pck) is kept on its release. Each release then
      # carries a patch for the installed APKs it can reach: the last ROLL builds before it that kept a base pack, plus
      # any older bases still listed in godot/patch_base.txt (build 15, which every APK from 15 to 23 was made from).
      - name: Stamp the build number
        env:
          GH_TOKEN: ${{ github.token }}
          ROLL: 3
        run: |
          N=$(( ${{ github.run_number }} - BUILD_SKIP ))
          echo "{\"build\": $N, \"base\": $N}" > godot/data/build.json
          BASES=""
          for t in $(gh release list --repo "${{ github.repository }}" --limit 30 --json tagName --jq '.[].tagName' | grep '^godot-' | sed 's/godot-//' | sort -rn); do
            [ "$t" -ge "$N" ] && continue
            if gh release view "godot-$t" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -qx "base-$t.pck"; then
              BASES="$BASES $t"
              [ $(echo $BASES | wc -w) -ge $ROLL ] && break
            fi
          done
          for t in $(cat godot/patch_base.txt 2>/dev/null); do
            case " $BASES " in *" $t "*) ;; *) BASES="$BASES $t";; esac
          done
          echo "PATCH_BASES=$BASES" >> $GITHUB_ENV
          cat godot/data/build.json
          echo "patches for: $BASES"
      - name: Import assets
        run: $HOME/bin/godot --headless --path godot --import || true
      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/godot/keys/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p godot/build
          $HOME/bin/godot --headless --path godot --export-debug "Android" build/AshfallMeridian.apk
          ls -la godot/build
          cp godot/build/AshfallMeridian.apk AshfallMeridian.apk
      # the in-game updater's download: a base build keeps its whole pack; later builds ship only what changed since
      - name: Export the update packs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(( ${{ github.run_number }} - BUILD_SKIP ))
          $HOME/bin/godot --headless --path godot --export-pack "Android" build/base.pck
          cp godot/build/base.pck base-$N.pck
          ASSETS="base-$N.pck"
          mkdir -p /tmp/base
          for t in $PATCH_BASES; do
            if gh release download "godot-$t" -p "base-$t.pck" -D /tmp/base --repo "${{ github.repository }}" --clobber; then
              $HOME/bin/godot --headless --path godot --export-patch "Android" build/patch-b$t.pck --patches /tmp/base/base-$t.pck
              cp godot/build/patch-b$t.pck patch-b$t.pck
              ASSETS="$ASSETS patch-b$t.pck"
              rm -f /tmp/base/base-$t.pck
            fi
          done
          echo "UPDATE_ASSETS=$ASSETS" >> $GITHUB_ENV
          ls -la *.pck
      - uses: actions/upload-artifact@v6
        with:
          name: AshfallMeridian-apk
          path: AshfallMeridian.apk
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(( ${{ github.run_number }} - BUILD_SKIP ))
          gh release create "godot-$N" AshfallMeridian.apk $UPDATE_ASSETS --title "Ashfall: Meridian (build $N)" --notes "Ashfall: Meridian, build $N. Tap AshfallMeridian.apk below to install, or update from the title screen (patch-bN.pck is the in-game update for an installed build N; base-N.pck is kept for later builds to patch against)." --target "${{ github.sha }}"
